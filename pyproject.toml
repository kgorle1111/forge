[project]
name = "forge-learning"
version = "0.1.0"
description = "The Forge: closed-loop active-recall learning system on LangGraph"
requires-python = ">=3.10"
dependencies = ["langgraph"]

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["forge"]

[tool.setuptools.package-data]
forge = ["*.html"]
